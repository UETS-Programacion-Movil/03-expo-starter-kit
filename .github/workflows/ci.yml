name: "Autograding"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  evaluate:
    name: "Autograding and Integrity Guard"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: "Checkout del Codigo"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Instalar Dependencias"
        run: pnpm install --no-frozen-lockfile

      # -----------------------------------------------------------------------
      # 1. FILE INTEGRITY GUARD (Anti-Tampering)
      # -----------------------------------------------------------------------
      - name: "File Integrity Guard"
        id: file_guard
        run: |
          echo "Verificando integridad de archivos modificados..."
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Archivos modificados en este PR:"
          echo "$CHANGED_FILES"
          
          UNAUTHORIZED_FILES=""
          for file in $CHANGED_FILES; do
            case "$file" in
              app.json | utils/* | components/* | app/* | README.md | CHEATSHEET_ESTUDIANTE.md)
                ;;
              *)
                UNAUTHORIZED_FILES="$UNAUTHORIZED_FILES $file"
                ;;
            esac
          done

          if [ -n "$UNAUTHORIZED_FILES" ]; then
            echo "Archivos no autorizados detectados:$UNAUTHORIZED_FILES"
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "unauthorized=$UNAUTHORIZED_FILES" >> $GITHUB_OUTPUT
          else
            echo "Integridad de archivos verificada con exito."
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 2. COMMIT LINTER (Conventional Commits)
      # -----------------------------------------------------------------------
      - name: "Commit Message Linter"
        id: commit_lint
        run: |
          echo "Verificando formato de mensajes de commit..."
          COMMITS=$(git log --format="%s" origin/main...HEAD)
          echo "Commits en este PR:"
          echo "$COMMITS"

          INVALID_COMMITS=""
          PATTERN="^(feat|fix|docs|style|refactor|test|chore)(\([a-zA-Z0-9_\-]+\))?: .+"

          while IFS= read -r commit; do
            if [ -n "$commit" ]; then
              if ! [[ "$commit" =~ $PATTERN ]]; then
                INVALID_COMMITS="$INVALID_COMMITS '$commit'"
              fi
            fi
          done <<< "$COMMITS"

          if [ -n "$INVALID_COMMITS" ]; then
            echo "Commits no convencionales detectados:$INVALID_COMMITS"
            echo "status=warn" >> $GITHUB_OUTPUT
            echo "invalid_commits=$INVALID_COMMITS" >> $GITHUB_OUTPUT
          else
            echo "Todos los commits siguen el estandar Conventional Commits."
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 3. TYPESCRIPT STRICT TYPECHECK (tsc --noEmit)
      # -----------------------------------------------------------------------
      - name: "TypeScript Strict Typecheck"
        id: typecheck
        continue-on-error: true
        run: |
          pnpm run check
          if [ $? -eq 0 ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
            echo "score=0.5" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "score=0.0" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 4. EJECUCION DE TESTS POR RETO
      # -----------------------------------------------------------------------
      - name: "Test Reto 01 — Expo Config"
        id: test_01
        continue-on-error: true
        run: |
          pnpm run start:01
          if [ $? -eq 0 ]; then
            echo "score=1.0" >> $GITHUB_OUTPUT
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "score=0.0" >> $GITHUB_OUTPUT
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: "Test Reto 02 — NativeWind Props"
        id: test_02
        continue-on-error: true
        run: |
          pnpm run start:02
          if [ $? -eq 0 ]; then
            echo "score=1.0" >> $GITHUB_OUTPUT
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "score=0.0" >> $GITHUB_OUTPUT
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: "Test Reto 03 — Red Institucional y Tunel"
        id: test_03
        continue-on-error: true
        run: |
          pnpm run start:03
          if [ $? -eq 0 ]; then
            echo "score=1.0" >> $GITHUB_OUTPUT
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "score=0.0" >> $GITHUB_OUTPUT
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: "Test Reto 04 — Desafio Integrador Bar Salesiano"
        id: test_04
        continue-on-error: true
        run: |
          pnpm run start:04
          if [ $? -eq 0 ]; then
            echo "score=1.0" >> $GITHUB_OUTPUT
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "score=0.0" >> $GITHUB_OUTPUT
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 5. CALCULO DE PUNTAJE TOTAL Y COMENTARIO EN EL PR
      # -----------------------------------------------------------------------
      - name: "Publicar Reporte de Evaluacion en el PR"
        uses: actions/github-script@v7
        with:
          script: |
            const s1 = parseFloat("${{ steps.test_01.outputs.score }}" || "0");
            const s2 = parseFloat("${{ steps.test_02.outputs.score }}" || "0");
            const s3 = parseFloat("${{ steps.test_03.outputs.score }}" || "0");
            const s4 = parseFloat("${{ steps.test_04.outputs.score }}" || "0");
            const sType = parseFloat("${{ steps.typecheck.outputs.score }}" || "0");
            
            const fileGuardPass = "${{ steps.file_guard.outputs.status }}" === "pass";
            const sGuard = fileGuardPass ? 0.5 : 0.0;
            
            const totalCodigo = s1 + s2 + s3 + s4 + sType + sGuard;
            const statusIcon = (score, max) => score === max ? "✅" : "❌";

            const body = `## 🤖 Reporte de Autograding — Semana 03 UETS
            
            ### 📊 Resumen de Calificación del Bloque A (Código: ${totalCodigo.toFixed(2)} / 5.00 pts)
            
            | Criterio / Reto | Estado | Puntaje |
            | :--- | :---: | :---: |
            | **Reto 01:** Configuración de Expo y app.json | ${statusIcon(s1, 1.0)} | \`${s1.toFixed(2)} / 1.00\` |
            | **Reto 02:** Props de Componentes NativeWind | ${statusIcon(s2, 1.0)} | \`${s2.toFixed(2)} / 1.00\` |
            | **Reto 03:** Red Institucional UETS y Modo Túnel | ${statusIcon(s3, 1.0)} | \`${s3.toFixed(2)} / 1.00\` |
            | **Reto 04:** Desafío Integrador Bar Salesiano | ${statusIcon(s4, 1.0)} | \`${s4.toFixed(2)} / 1.00\` |
            | **TypeScript Check:** \`tsc --noEmit\` sin errores | ${statusIcon(sType, 0.5)} | \`${sType.toFixed(2)} / 0.50\` |
            | **File Guard & Commits:** Integridad y Formato | ${statusIcon(sGuard, 0.5)} | \`${sGuard.toFixed(2)} / 0.50\` |
            | **TOTAL BLOQUE A (Código en GitHub):** | 🎯 | **\`${totalCodigo.toFixed(2)} / 5.00\`** |
            
            ---
            
            ### 📹 Recordatorio del Bloque B: Screencast Demostrativo (5.00 pts)
            Para completar la calificación de **10.00 puntos**, recuerda adjuntar en la descripción de este PR el enlace a tu video de máximo 3 minutos explicando:
            1. Configuración de \`app.json\` y modo \`--tunnel\`.
            2. Tipado de variantes y props con NativeWind.
            3. Demostración en vivo en terminal ejecutando \`pnpm run test:all\`.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
